<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Push Notification</title>
</head>
<body>
    <h1>Firebase Push Notification</h1>

    <!-- Firebase App and Messaging libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-messaging.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB-eO1E_oIVSVSuoHJGpiBkOlxdVccfVfU",
            authDomain: "portfolio-aee99.firebaseapp.com",
            projectId: "portfolio-aee99",
            storageBucket: "portfolio-aee99.appspot.com",
            messagingSenderId: "175332785816",
            appId: "1:175332785816:web:3fb968159905e0be5a5aed",
            measurementId: "G-DE73LEWJ5C"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const messaging = firebase.messaging();

        // Register the service worker
        function registerServiceWorker() {
            console.log('Attempting to register service worker...');
            return navigator.serviceWorker.register('/public/firebase-messaging-sw.js') // Adjust path if necessary
                .then((registration) => {
                    console.log('Service Worker registered with scope:', registration.scope);
                    return registration;
                })
                .catch((error) => {
                    console.error('Service Worker registration failed:', error);
                });
        }

        // Request notification permission and retrieve the FCM token
        function requestNotificationPermission() {
            console.log("Requesting notification permission...");
            return Notification.requestPermission()
                .then((permission) => {
                    if (permission === 'granted') {
                        console.log('Notification permission granted.');
                        return messaging.getToken();
                    } else {
                        console.warn('Notification permission not granted.');
                        throw new Error('Notification permission denied');
                    }
                })
                .catch((error) => {
                    console.error('Error in requestNotificationPermission:', error);
                });
        }

        // Function to handle sending the token to the server
        function handleToken(token) {
            console.log("Attempting to send token to server...");
            fetch('http://localhost:8001/sendnotification', { // Update to your server endpoint
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ token: token })
            })
            .then((response) => response.json())
            .then((data) => console.log('Token sent to server:', data))
            .catch((error) => console.error('Error sending token to server:', error));
        }

        // Initialize the process in sequential order
        registerServiceWorker()
            .then((registration) => {
                if (registration) {
                    return requestNotificationPermission(); // Call notification permission only if registration succeeded
                } else {
                    throw new Error("Service worker registration failed, cannot proceed");
                }
            })
            .then((token) => {
                if (token) {
                    console.log('FCM Token:', token);
                    handleToken(token);  // Send token to the server
                } else {
                    throw new Error("Token generation failed, cannot proceed");
                }
            })
            .catch((error) => {
                console.error('An error occurred during the notification setup process:', error);
            });
    </script>
</body>
</html>
